services:
  postgres:
    image: postgres:15
    container_name: mayan-postgres
    environment:
      POSTGRES_DB: mayan
      POSTGRES_USER: mayan
      POSTGRES_PASSWORD: Banque2024!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mayan-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mayan"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: mayan-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - mayan-network
    restart: always

  mayan:
    image: mayanedms/mayanedms:latest
    container_name: mayan-app
    ports:
      - "80:8000"
    environment:
      MAYAN_DATABASE_ENGINE: django.db.backends.postgresql
      MAYAN_DATABASE_NAME: mayan
      MAYAN_DATABASE_USER: mayan
      MAYAN_DATABASE_PASSWORD: Banque2024!
      MAYAN_DATABASE_HOST: postgres
      MAYAN_DATABASE_PORT: 5432
      MAYAN_CELERY_BROKER_URL: redis://redis:6379/0
      MAYAN_CELERY_RESULT_BACKEND: redis://redis:6379/0
      MAYAN_SECRET_KEY: "CleSecreteBanque2024!"
      MAYAN_LANGUAGE_CODE: "fr"
    volumes:
      - mayan_data:/var/lib/mayan
    networks:
      - mayan-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

volumes:
  postgres_data:
  redis_data:
  mayan_data:

networks:
  mayan-network:
    driver: bridge